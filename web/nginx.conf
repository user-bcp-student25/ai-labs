server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /auth/ {
    proxy_pass http://auth:8080;
    proxy_set_header Host $host;
  }

  location /api/ {
    client_max_body_size 0;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
